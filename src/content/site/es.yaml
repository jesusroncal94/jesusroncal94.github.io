principles:
  eyebrow: Cómo trabajo
  title: Tres reglas que no rompo
  items:
    - numeral: i.
      title: Evals antes que sensaciones
      body: Un cambio de prompt sale cuando un conjunto de fixtures dice que es mejor, no cuando suena mejor.
    - numeral: ii.
      title: Ningún umbral es una suposición
      body: Cada límite de un sistema a mi cargo tiene una medición al lado y una nota de lo que cuesta.
    - numeral: iii.
      title: El coste es una funcionalidad
      body: Tokens, latencia y dólares por petición están en el dashboard desde el primer día, y se reportan a quien paga.

