cv:
  summary: >-
    Ingeniero de software senior con más de 8 años en sistemas backend, APIs e infraestructura
    cloud; los últimos 4+ construyendo y operando aplicaciones en producción basadas en LLM.
    Recientemente Technical Lead de dos productos de IA, y actualmente AI Engineer en un
    tercero, diseñando sistemas multiagente, pipelines RAG y frameworks de evaluación para
    usuarios reales. Desarrolla y opera servicios en AWS y GCP con Python, Go, Java y
    TypeScript, trabajando a diario con agentes de programación con IA y las APIs de Claude,
    Gemini y OpenAI en equipos distribuidos de EE. UU., la UE y LATAM.
  highlights:
    - roleId: mindfortress-inc
      items:
        - >-
          Lideré la campaña de merge del MVP de Reeve: 112 pull requests en 4 repositorios, de
          la cola a producción en ~30 horas, orquestando agentes de Claude Code en paralelo
          tras un merge gate serial sin fallos nuevos.
        - >-
          Diseñé la arquitectura de la capa de IA de Freya: 7 agentes especializados junto a un
          motor de consistencia basado en un grafo de conocimiento (33 tipos de aristas,
          seguimiento epistémico) y coedición en tiempo real con Yjs/CRDT, sobre un backend
          FastAPI con más de 800 endpoints.
        - >-
          Diseñé un sistema de orquestación multiagente (niveles Coordinator, Manager y Worker)
          que enruta las peticiones de los usuarios por 8 canales de mensajería, de WhatsApp y
          Telegram a Slack y Teams.
        - >-
          Rastreé un gasto de IA no atribuido de ~$12–16/día hasta un worker obsoleto y lo
          reduje a $0, verificado en el ledger de producción; llevé el CI del backend de 11
          fallos intermitentes a 0.
    - roleId: intercorp-management-innova-latam
      items:
        - >-
          Soy responsable del sistema LLM en producción sobre Gemini 2.5 Pro (Vertex AI) que
          genera planes de clase alineados al currículo para Perú, Colombia y México.
        - >-
          Diseñé un pipeline de prompts guiado por evaluaciones (fixtures más LLM-as-judge, 5
          dimensiones y 19 ítems): conformidad estructural del 45,6 % al 100 %, −71 % de tokens
          de salida en los casos inflados.
        - >-
          Lideré la migración de n8n a Spring Boot y Spring AI (Java 21) en AWS ECS, con prompts
          versionados y observabilidad de tokens, coste y latencia por llamada.
    - roleId: accelone
      items:
        - >-
          Construí el backend de una plataforma de video en Django y PostgreSQL sobre AWS:
          procesamiento por colas de archivos multimedia muy grandes con SQS, búsqueda con
          Elasticsearch y pagos con Stripe.
    - roleId: wordbox
      items:
        - >-
          Integré LLMs de Google y OpenAI en pipelines de transcripción, traducción y
          aprendizaje adaptativo con más de 500.000 usuarios en más de 10 mercados, aumentando
          la satisfacción de los usuarios un 35 %.
        - >-
          Reescribí servicios centrales de Python a Go, reduciendo la latencia de la API un 40 %
          y soportando un 50 % más de usuarios concurrentes.
    - roleId: indra-pretty-technical
      items:
        - >-
          Construí APIs que sirven modelos predictivos de ML con un 95 % de cobertura de tests,
          y servicios backend en Go para clientes de videojuegos, finanzas y secuenciación de
          ADN.
    - roleId: red-cientifica-peruana
      items:
        - >-
          Internacionalicé Yachay (yachay.lat), una plataforma de hosting y dominios que da
          servicio a más de 11.000 empresas, impulsando un 25 % de crecimiento de ingresos en
          nuevos mercados.
    - roleId: codrise
      items:
        - Pasé del soporte TI L3 a Software Engineer, desarrollando aplicaciones web y APIs REST en PHP (Laravel, CodeIgniter).
