privacy:
  eyebrow: Privacidad
  title: Qué registra este sitio y qué no
  updated: '2026-10-15'
  sections:
    - heading: Qué se registra
      text: Qué página abres, el sitio desde el que llegas, el idioma en que la lees y cualquier etiqueta de campaña del enlace (utm_*). También si descargas el CV, copias o abres la dirección de email, abres mi LinkedIn o GitHub, o lees un caso hasta su resultado. Y si la página se muestra clara u oscura, si eso lo elegiste tú o tu sistema, y cuándo usas el selector de tema.
    - heading: Qué no
      text: Ninguna cookie. No se guarda en tu navegador nada que te identifique y nada vincula tus visitas de un día a otro. Tu dirección IP y el identificador de tu navegador se usan para contar la visita y después se descartan. Si eliges Claro u Oscuro, tu navegador guarda esa elección para que la siguiente página se abra igual; «Como el sistema» la borra.
    - heading: Adónde va
      text: A PostHog, que lo procesa en la UE. Lo uso para ver qué candidaturas y qué páginas funcionan, nunca para perfilar a nadie. Mis informes abarcan los últimos doce meses.
    - heading: Cómo desactivarlo
      text: Si tu navegador envía Global Privacy Control o Do Not Track, no se registra nada.
    - heading: Preguntas
      text: Escríbeme a jesusroncal94@gmail.com.

cv:
  summary:
    source: 'Senior software engineer with 8+ years across backend systems, APIs, and cloud infrastructure, the last 4+ building and operating production LLM-powered applications. Most recently Technical Lead on two AI products, and currently AI Engineer on a third, designing multi-agent systems, RAG pipelines, and evaluation frameworks for real users at scale. Daily hands-on with AI coding agents (Claude Code) and with Claude, Gemini, and GPT APIs. Ship and operate services on AWS and GCP in Python, Go, Java, and TypeScript, with earlier production experience in PHP (Laravel, CodeIgniter). Strong cross-functional collaborator across distributed US, EU, LATAM, and Asia-Pacific teams.'
    text: 'Ingeniero de software senior con más de 8 años en sistemas backend, APIs e infraestructura cloud; los últimos 4+ construyendo y operando aplicaciones en producción basadas en LLM. Recientemente Technical Lead de dos productos de IA, y actualmente AI Engineer en un tercero, diseñando sistemas multiagente, pipelines RAG y frameworks de evaluación para usuarios reales a escala. Trabaja a diario con agentes de programación con IA (Claude Code) y con las APIs de Claude, Gemini y GPT. Desarrolla y opera servicios en AWS y GCP con Python, Go, Java y TypeScript, con experiencia previa en producción con PHP (Laravel, CodeIgniter). Colabora de forma transversal con equipos distribuidos en EE. UU., la UE, LATAM y Asia-Pacífico.'
  bullets:
    - source: 'Design and operate the production LLM system behind Nauta, Innova Schools'' teacher platform, on Gemini 2.5 Pro and 3.x (Vertex AI), generating curriculum-aligned lesson plans for Peru, Colombia and Mexico: ~25K requests, 23K+ sessions and 362 active teachers in four weeks, at ~$0.09 per plan.'
      text: 'Diseño y opero el sistema LLM en producción detrás de Nauta, la plataforma docente de Innova Schools, sobre Gemini 2.5 Pro y 3.x (Vertex AI), que genera planes de clase alineados al currículo para Perú, Colombia y México: ~25.000 peticiones, más de 23.000 sesiones y 362 docentes activos en cuatro semanas, a ~$0,09 por plan.'
    - source: 'Proposed the move from n8n to a Spring Boot / Spring AI service (Java 21) and became its second-largest contributor; it runs on AWS ECS (DEV/STG/PRD) with SemVer-versioned prompts, per-call cost monitoring and a 19-panel Grafana dashboard.'
      text: 'Propuse el paso de n8n a un servicio en Spring Boot / Spring AI (Java 21) y llegué a ser su segundo mayor contribuidor; corre en AWS ECS (DEV/STG/PRD) con prompts versionados con SemVer, monitorización del coste por llamada y un dashboard de Grafana de 19 paneles.'
    - source: 'Shipped the unit-generation engine (v3): concurrent batch generation of whole units with per-session fault tolerance and deterministic guardrails (zero extra LLM calls), powering 14.9K pregenerated sessions.'
      text: 'Entregué el motor de generación de unidades (v3): generación concurrente por lotes de unidades completas con tolerancia a fallos por sesión y guardrails deterministas (sin llamadas extra al LLM), con 14.900 sesiones pregeneradas.'
    - source: 'Led the move of 15 AI tasks to Gemini 3.x with a paired-measurement harness on production cases (cost, latency, LLM-as-judge quality), at +2.9% total cost; built a conversational editing-agent POC on Google ADK (gate, planner, parallel executor).'
      text: 'Lideré el paso de 15 tareas de IA a Gemini 3.x con un arnés de mediciones pareadas sobre casos de producción (coste, latencia, calidad con LLM-as-judge), con un +2,9 % de coste total; construí una POC de agente conversacional de edición sobre Google ADK (gate, planificador, ejecutor en paralelo).'
    - source: 'Own AI cost governance: monthly Executive Committee reporting reconciled against the cloud invoice, a per-country cost model, an approved budget band and Slack budget alerts.'
      text: 'Soy responsable de la gobernanza del coste de IA: informes mensuales al Comité Ejecutivo conciliados con la factura cloud, un modelo de costes por país, una banda de presupuesto aprobada y alertas de presupuesto en Slack.'
    - source: 'Earlier, for NGR (via La Victoria Lab''s Salto program), built a WhatsApp sales assistant for Bembos on Azure OpenAI GPT-4o with function-calling intent detection.'
      text: 'Antes, para NGR (a través del programa Salto de La Victoria Lab), construí un asistente de ventas por WhatsApp para Bembos sobre Azure OpenAI GPT-4o con detección de intención mediante function calling.'
    - source: 'Technical Lead for two AI products (Freya, an AI writing partner in production; Reeve, an AI commerce-growth platform at MVP) in a team spread across US, European and Asia-Pacific time zones: owned code review and release gating, coordinated technical decisions with the team and supported teammates through reviews and onboarding guides.'
      text: 'Fui Technical Lead de dos productos de IA (Freya, un compañero de escritura con IA en producción; Reeve, una plataforma de IA para el crecimiento de comercios en fase MVP) en un equipo repartido entre husos horarios de EE. UU., Europa y Asia-Pacífico: fui responsable de la revisión de código y el control de releases, coordiné las decisiones técnicas con el equipo y apoyé a mis compañeros con revisiones y guías de incorporación.'
    - source: 'Designed and ran the team''s AI-assisted delivery system on Claude Code, packaged as mindfortress-claude and adopted by the team: role agents and commands for each SDLC stage, session tooling that cross-references Linear, GitHub and Slack, human approval gates for deploys, and the standards it encodes (spec-driven development, branching strategy).'
      text: 'Diseñé y operé el sistema de entrega asistida por IA del equipo sobre Claude Code, empaquetado como mindfortress-claude y adoptado por el equipo: agentes por rol y comandos para cada etapa del SDLC, herramientas de sesión que cruzan Linear, GitHub y Slack, gates de aprobación humana para los despliegues y los estándares que codifica (desarrollo guiado por especificaciones, estrategia de ramas).'
    - source: 'Release gate for Reeve (1,900+ PRs merged, mostly teammates''); in the MVP merge campaign, cleared 110+ queued PRs across 4 repos in ~30h by orchestrating parallel Claude Code agents (isolated worktrees, stacked PR chains) behind serial merge gates, fixing security findings along the way.'
      text: 'Hice de gate de releases de Reeve (más de 1.900 PRs fusionados, la mayoría de compañeros del equipo); en la campaña de merge del MVP, vacié una cola de más de 110 PRs en 4 repositorios en ~30 h orquestando agentes de Claude Code en paralelo (worktrees aislados, cadenas de PRs apiladas) tras merge gates seriales, y corregí hallazgos de seguridad por el camino.'
    - source: 'Co-architected Freya''s AI layer as Technical Lead, authoring its "hourglass" model (many input channels feed one facts-only knowledge base that drives prose generation, with inbound and outbound subagents), and hardened it for production: unified model routing, per-project isolation, real token/cost tracking and non-blocking AI calls. The platform spans 7 RAG-grounded agents, a knowledge-graph consistency engine and Yjs/CRDT editing on FastAPI (900+ endpoints).'
      text: 'Co-diseñé como Technical Lead la capa de IA de Freya y fui autor de su modelo en "reloj de arena" (muchos canales de entrada alimentan una única base de conocimiento solo con hechos que guía la generación de prosa, con subagentes de entrada y de salida), y la preparé para producción: enrutamiento unificado de modelos, aislamiento por proyecto, seguimiento real de tokens y costes y llamadas de IA no bloqueantes. La plataforma abarca 7 agentes con RAG, un motor de consistencia basado en un grafo de conocimiento y edición con Yjs/CRDT sobre FastAPI (más de 900 endpoints).'
    - source: 'Restored Freya''s full backend test suite to CI (pytest and Alembic upgrades on a real Postgres) and drove the inherited failing baseline from 64 to 0, root-causing a stale SQLAlchemy comparator memoization.'
      text: 'Devolví al CI la suite completa de tests del backend de Freya (pytest y upgrades de Alembic sobre un Postgres real) y llevé la base de fallos heredada de 64 a 0, encontrando la causa en una memoización obsoleta de un comparador de SQLAlchemy.'
    - source: 'Root-caused a ~$16/day unattributed AI-spend leak to a stale staging worker running against the production database; shipped a code guard and split prod/staging credentials.'
      text: 'Encontré la causa de una fuga de gasto de IA no atribuido de ~$16/día: un worker de staging obsoleto que trabajaba contra la base de datos de producción; entregué una protección en el código y separé las credenciales de producción y staging.'
    - source: 'Owned environment health and deploys (Reeve deploy runbook, Freya uptime-monitor hardening, AWS EC2 and Railway operations) and hardened Reeve''s multi-channel agent gateway (auth gate, idempotency, loop detection).'
      text: 'Fui responsable de la salud de los entornos y de los despliegues (runbook de despliegue de Reeve, refuerzo del monitor de disponibilidad de Freya, operaciones en AWS EC2 y Railway) y reforcé el gateway de agentes multicanal de Reeve (gate de autenticación, idempotencia, detección de bucles).'
    - source: 'Built and operated the backend for a video platform in Django / PostgreSQL on AWS, owning the storage, upload and update pipelines for very large media files with asynchronous, queue-based processing on AWS SQS.'
      text: 'Construí y operé el backend de una plataforma de video en Django / PostgreSQL sobre AWS, a cargo de los pipelines de almacenamiento, subida y actualización de archivos multimedia muy grandes, con procesamiento asíncrono por colas en AWS SQS.'
    - source: 'Modeled video metadata for filtering and search and implemented search with Elasticsearch.'
      text: 'Modelé los metadatos de los videos para el filtrado y la búsqueda, e implementé la búsqueda con Elasticsearch.'
    - source: 'Integrated Stripe for payments and content management on the platform.'
      text: 'Integré Stripe para los pagos y la gestión de contenidos de la plataforma.'
    - source: 'Integrated Google and OpenAI LLMs into the content pipeline for automated transcription, translation, and adaptive learning, serving 500,000+ users across 10+ markets and lifting user satisfaction 35%.'
      text: 'Integré LLMs de Google y OpenAI en el pipeline de contenidos para transcripción, traducción y aprendizaje adaptativo automatizados, con más de 500.000 usuarios en más de 10 mercados, aumentando la satisfacción de los usuarios un 35 %.'
    - source: 'Designed asynchronous, event-driven processing with Redis and Google Cloud Pub/Sub to decouple services across the content platform.'
      text: 'Diseñé un procesamiento asíncrono y orientado a eventos con Redis y Google Cloud Pub/Sub para desacoplar los servicios de la plataforma de contenidos.'
    - source: 'Refactored core services from Python to Go, reducing API latency 40% and supporting a 50% increase in concurrent users.'
      text: 'Reescribí servicios centrales de Python a Go, reduciendo la latencia de la API un 40 % y soportando un 50 % más de usuarios concurrentes.'
    - source: 'Built APIs serving predictive ML models, primarily in Python with PHP (Laravel) services, achieving 95% test coverage; improved CI/CD, accelerating deployment cycles 40% (Indra, Peru).'
      text: 'Construí APIs que sirven modelos predictivos de ML, sobre todo en Python y con servicios en PHP (Laravel), con un 95 % de cobertura de tests; mejoré el CI/CD, acelerando los ciclos de despliegue un 40 % (Indra, Perú).'
    - source: 'Built backend systems and APIs primarily in Go, also delivering PHP (Laravel) services, for gaming, finance, and DNA-sequencing data processing (Pretty Technical, Netherlands; client: Elimbio, USA).'
      text: 'Construí sistemas backend y APIs sobre todo en Go, además de servicios en PHP (Laravel), para el procesamiento de datos de videojuegos, finanzas y secuenciación de ADN (Pretty Technical, Países Bajos; cliente: Elimbio, EE. UU.).'
    - source: 'Internationalized Yachay (yachay.lat), a web hosting and domain platform serving 11,000+ businesses, driving 25% revenue growth in new markets.'
      text: 'Internacionalicé Yachay (yachay.lat), una plataforma de hosting y dominios que da servicio a más de 11.000 empresas, impulsando un 25 % de crecimiento de ingresos en nuevos mercados.'
    - source: 'Progressed from L3 IT Support to Software Engineer, building web applications and REST APIs in PHP (Laravel, CodeIgniter and pure PHP); integrated satellite applications with transactional databases and reporting services.'
      text: 'Pasé del soporte TI L3 a Software Engineer, desarrollando aplicaciones web y APIs REST en PHP (Laravel, CodeIgniter y PHP puro); integré aplicaciones satélite con bases de datos transaccionales y servicios de reportes.'
