privacy:
  eyebrow: Privacy
  title: What this site records, and what it does not
  updated: '2026-10-15'
  sections:
    - heading: What is recorded
      text: Which page you open, the site that sent you, the language you read it in, and any campaign tag in the link (utm_*). Also whether you download the CV, copy or open the email address, open my LinkedIn or GitHub, or read a case study to its result. And whether the page is shown light or dark, whether you or your system chose that, and when you use the theme switch.
    - heading: What is not
      text: No cookies. Nothing that identifies you is stored in your browser, and nothing links your visits from one day to the next. Your IP address and your browser's user agent are used to count the visit and then discarded. If you pick Light or Dark, your browser keeps that choice so the next page opens the same way; Match system removes it.
    - heading: Where it goes
      text: To PostHog, processed in the EU. I use it to see which applications and pages work, never to profile anyone. My reports cover the last twelve months.
    - heading: Turning it off
      text: If your browser sends Global Privacy Control or Do Not Track, nothing is recorded at all.
    - heading: Questions
      text: Write to jesusroncal94@gmail.com.
