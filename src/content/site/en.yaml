principles:
  eyebrow: How I work
  title: Three rules I don’t break
  items:
    - numeral: i.
      title: Evals before vibes
      body: A prompt change ships when a fixture set says it is better — not when it reads better.
    - numeral: ii.
      title: No threshold is a guess
      body: Every limit in a system I own has a measurement next to it, and a note on what it costs.
    - numeral: iii.
      title: Cost is a feature
      body: Tokens, latency and dollars per request are on the dashboard from day one, and reported to whoever pays.

