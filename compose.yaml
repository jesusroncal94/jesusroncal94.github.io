x-node: &node
  image: node:22-alpine
  working_dir: /app
  environment:
    WATCH_MODE: polling
    ASTRO_TELEMETRY_DISABLED: "1"
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - npm_cache:/root/.npm

services:
  web:
    <<: *node
    command: sh -c "npm ci --prefer-offline && npm run dev"
    ports:
      - "4321:4321"

  build:
    <<: *node
    command: sh -c "npm ci --prefer-offline && npm run build"

  preview:
    <<: *node
    command: sh -c "npm ci --prefer-offline && npm run build && npm run preview"
    ports:
      - "4321:4321"

  test:
    <<: *node
    command: sh -c "npm ci --prefer-offline && npm run test"

  export:
    <<: *node
    command: sh -c "npm ci --prefer-offline && npm run export"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/root/.npm
      - ../cv-manager:/cv-manager:ro

  fonts:
    image: python:3.12-slim
    working_dir: /app
    command: sh scripts/subset-fonts.sh
    volumes:
      - .:/app
      - node_modules:/app/node_modules:ro

volumes:
  node_modules:
  npm_cache:
